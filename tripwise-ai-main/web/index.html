</form>
<div id="out"></div>

const MX={"Mumbai":1.4,"Delhi":1.1,"Bengaluru":1.2,"Andaman":1.3,"Leh":1.3,"Dubai":2.5,"Singapore":3.0,"Bangkok":1.5,"Bali":1.4,"Paris":4.0,"London":4.5,"Tokyo":3.0,"Maldives":4.0,"Kathmandu":0.8,"Kuala Lumpur":1.3,"Istanbul":1.6,"New York":5.0,"Sydney":4.0,"Rome":3.5};
const INT=["nature","adventure","history","beaches","shopping","food","culture"];
const STAY={budget:800,standard:2000,luxury:5000},FOOD={budget:400,standard:800,luxury:1500};
const D=CSV.split("\n").map(l=>{const c=l.split(",");return{dest:c[0],name:c[1],tags:c[2].split("|"),type:c[3],cost:+c[4],rating:+c[5],hrs:+c[6],lat:+c[7],lon:+c[8]}});
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString("en-IN");

// 1. Recommender: cosine similarity over [interest tags | rating | affordability]
function rank(dest,ints,budget,days,ppl){
  const sub=D.filter(p=>p.dest==dest),mx=Math.max(1,...sub.map(p=>p.cost));
  const tight=Math.min(1,Math.max(0,1-budget/Math.max(ppl*days,1)/6000)),set=ints.length?ints:INT;
  const u=[...INT.map(i=>set.includes(i)?1:0),.35,tight*.25];
  return sub.map(p=>{
    const v=[...INT.map(i=>p.tags.includes(i)?1:0),p.rating/5*.35,(1-p.cost/mx)*.25];
    const dot=v.reduce((s,x,i)=>s+x*u[i],0),n=Math.hypot(...v)*Math.hypot(...u);
    return{...p,score:n?dot/n:0}}).sort((a,b)=>b.score-a.score)}

// 2. Budget optimizer
function tcost(t){if(t.tr=="car")return Math.ceil(t.ppl/4)*t.km*2*11;
  if(t.tr=="flight")return t.ppl*2*(3500+Math.max(t.km-500,0)*3);
  return t.ppl*t.km*2*(t.tr=="bus"?1.5:2)}
function est(t,pl){
  const m=MX[t.dest]||1;
  const loc=m*(t.local=="public"?120*t.ppl*t.days:Math.ceil(t.ppl/4)*1800*t.days);
  const o={"Transport":tcost(t),"Accommodation":m*STAY[t.stay]*Math.ceil(t.ppl/2)*Math.max(t.days-1,0),
    "Food":m*FOOD[t.stay]*t.ppl*t.days,"Activities":pl.reduce((s,p)=>s+p.cost,0)*t.ppl,"Local travel":loc};
  const s=Object.values(o).reduce((a,b)=>a+b,0);o["Emergency (10%)"]=s*.1;o.TOTAL=s*1.1;return o}
function optimise(t,sel,pool){
  t={...t};sel=[...sel];pool=[...pool];const ch=[],al=[],over=()=>est(t,sel).TOTAL>t.budget,first=est(t,sel).TOTAL;
  if(over())al.push(`Budget overrun: estimated ₹${fmt(first)} vs budget ₹${fmt(t.budget)}.`);
  const SL=["budget","standard","luxury"],TD=["flight","car","train","bus"];
  while(over()&&t.stay!="budget"){const n=SL[SL.indexOf(t.stay)-1];ch.push(`Stay ${t.stay} → ${n} (also lowers food cost)`);t.stay=n}
  if(over()&&t.local!="public"){ch.push("Local travel cab → public transport");t.local="public"}
  while(over()&&t.tr!="bus"){const n=TD[TD.indexOf(t.tr)+1];ch.push(`Long-distance transport ${t.tr} → ${n}`);t.tr=n}
  while(over()){const paid=sel.filter(p=>p.cost>0);if(!paid.length)break;
    const v=paid.reduce((a,b)=>a.score/a.cost<b.score/b.cost?a:b);sel=sel.filter(p=>p!==v);
    const k=pool.findIndex(p=>p.cost<=v.cost*.5);
    if(k>=0){const r=pool.splice(k,1)[0];sel.push(r);ch.push(`Replaced ${v.name} (₹${v.cost}) with cheaper ${r.name}`)}
    else ch.push(`Dropped paid activity ${v.name} (₹${v.cost})`)}
  const b=est(t,sel),fits=b.TOTAL<=t.budget;
  if(al.length&&!fits)al.push("Even the cheapest options exceed the budget. Increase the budget or reduce days/people.");
  return{t,sel:sel.sort((a,b)=>b.score-a.score),b,al,ch,fits}}

// 3. Itinerary generator
const km=(a,b)=>{const r=Math.PI/180,h=Math.sin((b.lat-a.lat)*r/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin((b.lon-a.lon)*r/2)**2;return 2*6371*Math.asin(Math.sqrt(h))*1.3};
const hm=h=>{const m=Math.round(h*60);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
function itin(pl,days){let rem=[...pl].sort((a,b)=>b.score-a.score);const out=[];
  for(let d=1;d<=days;d++){let t=9,pos=null,lunch=false,n=0;const s=[];
    while(rem.length&&n<4){
      if(!lunch&&t>=12.5){s.push({a:t,b:t+1,w:"🍽️ Lunch break"});t+=1;lunch=true}
      const opts=rem.map(p=>({p,tr:pos?km(pos,p)/30:0})).filter(o=>t+o.tr+o.p.hrs<=19);
      if(!opts.length)break;
      const o=pos?opts.reduce((a,b)=>a.tr<=b.tr?a:b):opts[0];
      if(pos&&o.tr>0){s.push({a:t,b:t+o.tr,w:"🚗 Travel to "+o.p.name});t+=o.tr}
      s.push({a:t,b:t+o.p.hrs,w:"📍 "+o.p.name+(o.p.cost?` (₹${o.p.cost} pp)`:"")});t+=o.p.hrs;pos=o.p;n++;rem=rem.filter(x=>x!==o.p)}
    out.push(s)}
  return{out,left:rem}}

// UI
$("dl").innerHTML=[...new Set(D.map(p=>p.dest))].map(d=>`<option value="${d}">`).join("");
$("ints").innerHTML=INT.map(i=>`<label><input type="checkbox" value="${i}" ${["nature","adventure","beaches"].includes(i)?"checked":""} hidden><span>${i}</span></label>`).join("");
let last=null;
function run(){
  const ints=[...document.querySelectorAll("#ints input:checked")].map(x=>x.value);
  const v=id=>$(id).value,N=id=>Math.max(1,+$(id).value||1);
  const names=[...new Set(D.map(p=>p.dest))],q=$("dest").value.trim().toLowerCase();
  const dest=names.find(n=>n.toLowerCase()==q)||(q&&names.find(n=>n.toLowerCase().includes(q)||q.includes(n.toLowerCase())));
  if(!dest){$("out").innerHTML=`<div class="al wn">No data for "${$("dest").value}". Try: ${names.join(", ")}.</div>`;return}
  const budget=N("budget"),days=Math.min(7,N("days")),ppl=N("ppl");
  const ranked=rank(dest,ints,budget,days,ppl),n=Math.min(ranked.length,days*3);
  const r=optimise({dest,budget,days,ppl,stay:v("stay"),tr:v("tr"),local:v("local"),km:N("km")},ranked.slice(0,n),ranked.slice(n));
  const it=itin(r.sel,days);last={r,ints,dest:dest,budget,days,ppl};
  const T=r.b.TOTAL,parts=Object.entries(r.b).filter(([k])=>k!="TOTAL"),mx=Math.max(...parts.map(x=>x[1]),1);
  $("out").innerHTML=`
  <div class="m"><div><small>Estimated total</small><b>₹${fmt(T)}</b></div><div><small>Budget</small><b>₹${fmt(budget)}</b></div><div><small>Remaining</small><b>₹${fmt(budget-T)}</b></div></div><br>
  ${r.al.map(a=>`<div class="al wn">${a}</div>`).join("")}${r.ch.map(c=>`<div class="al in">${c}</div>`).join("")}
  <div class="al ${r.fits?"ok":"wn"}">${r.fits?(r.al.length?"After the changes above, the plan fits your budget.":"Plan fits within your budget."):"Plan does not fit the budget."}</div>
  <div class="card"><h2>Day-wise itinerary</h2>${it.out.map((s,i)=>`<b>Day ${i+1}</b>${s.length?s.map(x=>`<div class="row"><span class="t">${hm(x.a)}–${hm(x.b)}</span><span>${x.w}</span></div>`).join(""):"<div class='row'>Free day / rest</div>"}<br>`).join("")}
  ${it.left.length?`<small>Could not fit: ${it.left.map(p=>p.name).join(", ")}</small>`:""}</div>
  <div class="card"><h2>Budget breakdown</h2>${parts.map(([k,x])=>`<div class="bar"><span>${k}</span><i style="width:${x/mx*55}%"></i><span style="color:var(--tx)">₹${fmt(x)}</span></div>`).join("")}</div>
  <div class="card"><h2>Recommended (cosine similarity)</h2><div class="sc"><table><tr><th>Place</th><th>Tags</th><th>Cost</th><th>Rating</th><th>Score</th></tr>${ranked.map(p=>`<tr><td>${p.name}</td><td>${p.tags.join(", ")}</td><td>₹${p.cost}</td><td>${p.rating}</td><td>${p.score.toFixed(3)}</td></tr>`).join("")}</table></div></div>
  <div class="card"><h2>Saved plans</h2><button type="button" onclick="save()">💾 Save this plan</button> <button type="button" class="g" onclick="clr()">Clear</button><div id="sv" style="margin-top:10px"></div></div>`;
  showSaved()}
function get(){try{return JSON.parse(localStorage.getItem("tw")||"[]")}catch(e){return[]}}
function put(a){try{localStorage.setItem("tw",JSON.stringify(a))}catch(e){}}
function save(){const {r,dest,budget,days,ppl}=last;put([{t:new Date().toLocaleString(),dest,budget,days,ppl,total:r.b.TOTAL,fits:r.fits,places:r.sel.map(p=>p.name).join(", ")},...get()]);showSaved()}
function clr(){put([]);showSaved()}
function showSaved(){const a=get();$("sv").innerHTML=a.length?a.map(s=>`<div class="row"><span class="t">${s.t}</span><span>${s.dest}, ${s.days}d, ${s.ppl}p, ₹${fmt(s.total)} / ₹${fmt(s.budget)} ${s.fits?"✅":"⚠️"}<br><small>${s.places}</small></span></div>`).join(""):"<small>No saved plans yet.</small>"}
run();
</script></body></html>
